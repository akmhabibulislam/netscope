[package]
name = "netscope-network"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Network interface statistics, sockets, routes, and diagnostic tests for NetScope"

[dependencies]
netscope-core = { path = "../netscope-core" }
netscope-process = { path = "../netscope-process" }
netscope-dns = { path = "../netscope-dns" }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
ipnetwork = "0.20"
socket2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
