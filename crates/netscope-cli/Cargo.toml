[package]
name = "netscope-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NetScope Command Line Interface companion"

[[bin]]
name = "netscope-cli"
path = "src/main.rs"

[dependencies]
netscope-core = { path = "../netscope-core" }
netscope-network = { path = "../netscope-network" }
netscope-process = { path = "../netscope-process" }
netscope-dns = { path = "../netscope-dns" }
netscope-security = { path = "../netscope-security" }
netscope-storage = { path = "../netscope-storage" }

tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
comfy-table = "7.1"
