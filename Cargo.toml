[workspace]
members = [
    "crates/netscope-core",
    "crates/netscope-network",
    "crates/netscope-process",
    "crates/netscope-dns",
    "crates/netscope-security",
    "crates/netscope-storage",
    "crates/netscope-platform",
    "crates/netscope-cli",
    ".",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NetScope Contributors <dev@netscope.internal>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/netscope/netscope"
homepage = "https://github.com/netscope/netscope"
description = "A professional, cross-distribution Linux network intelligence application."

[package]
name = "netscope"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NetScope Desktop Application"

[dependencies]
netscope-core = { path = "crates/netscope-core" }
netscope-network = { path = "crates/netscope-network" }
netscope-process = { path = "crates/netscope-process" }
netscope-dns = { path = "crates/netscope-dns" }
netscope-security = { path = "crates/netscope-security" }
netscope-storage = { path = "crates/netscope-storage" }
netscope-platform = { path = "crates/netscope-platform" }

tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
relm4 = { version = "0.9", features = ["libadwaita"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
directories = "5.0"
async-channel = "2.3"
