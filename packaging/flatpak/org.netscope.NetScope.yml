app-id: org.netscope.NetScope
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: netscope-gui
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host:ro
  - --system-talk-name=org.freedesktop.resolve1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/netscope/cargo
modules:
  - name: netscope
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/netscope /app/bin/netscope-gui
      - install -Dm644 resources/netscope.desktop /app/share/applications/org.netscope.NetScope.desktop
      - install -Dm644 resources/icons/netscope.svg /app/share/icons/hicolor/scalable/apps/org.netscope.NetScope.svg
    sources:
      - type: dir
        path: ../../
